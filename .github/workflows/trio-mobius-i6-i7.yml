name: Trio liftabilidade Mobius
on:
  push:
    branches: [experiment/trio-mobius-i6-i7]
    paths: [.github/workflows/trio-mobius-i6-i7.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: contatofilipevono-rgb/n1-sat-cubos
          ref: 339206163656330575cd9a6fe5a2624502c848b2
          path: dados
          persist-credentials: false
      - name: Compilar verificadores
        run: |
          git clone -q --depth 1 https://github.com/arminbiere/cadical.git ferramentas-cadical
          (cd ferramentas-cadical && ./configure -q && make -s -j2)
          cp ferramentas-cadical/build/cadical ./cadical
          git clone -q --depth 1 https://github.com/marijnheule/drat-trim.git ferramentas-drat
          gcc -O2 ferramentas-drat/drat-trim.c -o drat-trim
          mkdir -p trio-mobius-artifacts
          { git -C dados rev-parse HEAD; git -C ferramentas-cadical rev-parse HEAD; git -C ferramentas-drat rev-parse HEAD; ./cadical --version; } > trio-mobius-artifacts/toolchain.txt
      - name: Controles e provas para os cinco trios
        run: |
          cat > trio_mobius.py <<'PYTHON'
          """Möbius mod 8 on 11 Boolean variables; R has all 232 degree <=3 bits."""
          import hashlib
          import itertools
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path
          
          N = 11
          VARIABLES = [f"y{i}" for i in range(8)] + ["x1", "x2", "x3"]
          T = {15, 86, 89, 90, 101, 106, 149, 154, 165, 166, 169, 240}
          R_MASKS = [m for m in range(1 << N) if m.bit_count() <= 3]
          POSITIVE = {3, 7, 10, 13, 14, 24, 25, 34, 36, 38, 40, 48, 65, 66, 69, 73, 81, 96, 131, 134, 137, 145, 146, 160, 192, 193, 194}
          NEGATIVE = {5, 7, 12, 13, 20, 21, 22, 25, 26, 34, 35, 36, 38, 44, 52, 67, 69, 70, 80, 81, 82, 152, 164}
          EXPECTED_SHA256 = "438c50c4e285b883bcb67df8632a6cef568896d964e5b50b423b3d3572eedc77"
          OUT = Path("trio-mobius-artifacts")
          
          
          def top_from_trio(trio):
              top = set(T)
              assert len(trio["phi"]) == 3
              for i, phi in enumerate(trio["phi"], 8):
                  for term in phi.split(" + "):
                      assert re.fullmatch(r"(y[0-7]){3}", term), term
                      ys = [int(k) for k in re.findall(r"y([0-7])", term)]
                      assert len(set(ys)) == 3, term
                      top ^= {(1 << i) | sum(1 << k for k in ys)}
              return top
          
          
          def coefficients(anf):
              # Direct truth table, then exact integer Möbius, independent of the CNF.
              values = [sum(m & point == m for m in anf) % 2 for point in range(1 << N)]
              for k in range(N):
                  bit = 1 << k
                  for s in range(1 << N):
                      if s & bit:
                          values[s] -= values[s ^ bit]
              return values
          
          
          def failures(coeffs, degree, divisor):
              return [[s, c] for s, c in enumerate(coeffs) if s.bit_count() >= degree and c % divisor]
          
          
          def odd_degree8(top):
              pairs = {}
              for a, b in itertools.combinations(sorted(top), 2):
                  if not a & b:
                      pairs.setdefault(a | b, []).append([a, b])
              return {s: ps for s, ps in sorted(pairs.items()) if len(ps) % 2}
          
          
          class Circuit:
              def __init__(self):
                  self.nvars = len(R_MASKS)
                  self.clauses = []
          
              def new(self):
                  self.nvars += 1
                  return self.nvars
          
              @staticmethod
              def neg(a):
                  return not a if isinstance(a, bool) else -a
          
              def xor(self, a, b):
                  if isinstance(a, bool):
                      return self.neg(b) if a else b
                  if isinstance(b, bool):
                      return self.neg(a) if b else a
                  if abs(a) == abs(b):
                      return a != b
                  z = self.new()
                  self.clauses.extend([[-z, a, b], [-z, -a, -b], [z, -a, b], [z, a, -b]])
                  return z
          
              def conj(self, a, b):
                  if isinstance(a, bool):
                      return b if a else False
                  if isinstance(b, bool):
                      return a if b else False
                  if abs(a) == abs(b):
                      return a if a == b else False
                  z = self.new()
                  self.clauses.extend([[-z, a], [-z, b], [z, -a, -b]])
                  return z
          
              def force(self, a, value):
                  if isinstance(a, bool):
                      if a != value:
                          self.clauses.append([])
                  else:
                      self.clauses.append([a if value else -a])
          
              def sub(self, a, b):
                  result = []
                  borrow = False
                  for k, (u, v) in enumerate(zip(a, b)):
                      p = self.xor(u, v)
                      result.append(self.xor(p, borrow))
                      if k < 2:
                          borrow = self.xor(self.conj(self.neg(u), v), self.conj(self.neg(p), borrow))
                  return result
          
          
          def encode(top, fixed_r=None, use_degree8=True):
              c = Circuit()
              table = [m in top for m in range(1 << N)]
              for index, m in enumerate(R_MASKS, 1):
                  table[m] = index
                  if fixed_r is not None:
                      c.force(index, m in fixed_r)
              for k in range(N):
                  bit = 1 << k
                  for s in range(1 << N):
                      if s & bit:
                          table[s] = c.xor(table[s], table[s ^ bit])
              mod8 = [[a, False, False] for a in table]
              for k in range(N):
                  bit = 1 << k
                  for s in range(1 << N):
                      if s & bit:
                          mod8[s] = c.sub(mod8[s], mod8[s ^ bit])
              odd = odd_degree8(top) if use_degree8 else {}
              for s, bits in enumerate(mod8):
                  # For degree 8, R cannot contribute mod 4. The bit is odd pair parity.
                  # Only add a unit where independently shown: c_s mod 4 = 2.
                  if s in odd:
                      c.force(bits[1], True)
                  if s.bit_count() >= 6:
                      c.force(bits[1], False)
                  if s.bit_count() >= 7:
                      c.force(bits[2], False)
              return c
          
          
          def run_solver(label, top, fixed_r, expected, shortcut=True):
              c = encode(top, fixed_r, shortcut)
              cnf = OUT / (label + ".cnf")
              proof = OUT / (label + ".drat")
              log = OUT / (label + ".solver.log")
              with cnf.open("w", encoding="ascii") as f:
                  f.write(f"p cnf {c.nvars} {len(c.clauses)}\n")
                  f.writelines(" ".join(map(str, clause + [0])) + "\n" for clause in c.clauses)
              result = {"case": label, "variables_cnf": c.nvars, "clauses_cnf": len(c.clauses)}
              with log.open("w", encoding="ascii") as f:
                  call = subprocess.run(["./cadical", "-t", "120", str(cnf), str(proof)], stdout=f,
                                        stderr=subprocess.STDOUT, timeout=145)
              if call.returncode == 20:
                  p = subprocess.run(["./drat-trim", str(cnf), str(proof), "-t", "60"],
                                     capture_output=True, text=True, timeout=75)
                  (OUT / (label + ".drat-trim.log")).write_text(p.stdout + p.stderr, encoding="utf-8")
                  assert p.returncode == 0 and "s VERIFIED" in p.stdout, label
                  result.update(result="UNSAT", drat_verified=True)
              elif call.returncode == 10:
                  model = {int(v) for line in log.read_text().splitlines() if line.startswith("v ")
                           for v in line.split()[1:]}
                  assert all(i in model or -i in model for i in range(1, len(R_MASKS) + 1))
                  r = [m for i, m in enumerate(R_MASKS, 1) if i in model]
                  if fixed_r is not None:
                      assert set(r) == fixed_r
                  ints = coefficients(top | set(r))
                  assert not failures(ints, 6, 4) and not failures(ints, 7, 8)
                  result.update(result="SAT", R_masks=r, D_masks=sorted(top | set(r)),
                                truth_table_verified_points=1 << N)
                  proof.unlink(missing_ok=True)
              else:
                  raise RuntimeError(f"{label}: CaDiCaL exited {call.returncode}; see {log}")
              assert result["result"] == expected, result
              print(json.dumps(result), flush=True)
              return result
          
          
          def main():
              raw = Path(sys.argv[1]).read_bytes().replace(b"\r\n", b"\n")
              assert hashlib.sha256(raw).hexdigest() == EXPECTED_SHA256
              cases = json.loads(raw)["trios"]
              assert len(cases) == 5 and len(R_MASKS) == 232
              pos = coefficients(T | POSITIVE)
              neg = coefficients(T | NEGATIVE)
              assert not failures(pos, 6, 4) and not failures(pos, 7, 8)
              assert not failures(neg, 6, 4) and failures(neg, 7, 8)
              audit = {"variable_order": VARIABLES, "T_masks": sorted(T), "R_free_bits": len(R_MASKS),
                       "input_sha256_lf": EXPECTED_SHA256,
                       "positive_R_masks": sorted(POSITIVE), "negative_R_masks": sorted(NEGATIVE),
                       "negative_I7_violations": failures(neg, 7, 8), "trios": []}
              for i, trio in enumerate(cases, 1):
                  top = top_from_trio(trio)
                  odd = odd_degree8(top)
                  # Verify the parity computation using all 2048 truth-table entries.
                  exact = coefficients(top)
                  assert set(odd) == {s for s in range(1 << N) if s.bit_count() == 8 and exact[s] % 4 == 2}
                  first = next(iter(odd))
                  audit["trios"].append({"index": i, "top_masks": sorted(top), "odd_degree8_count": len(odd),
                                        "witness_mask": first, "disjoint_pairs": odd[first],
                                        "c_S_for_R_zero": exact[first], "c_S_mod4_for_all_R": 2})
              OUT.mkdir(exist_ok=True)
              (OUT / "auditoria.json").write_text(json.dumps(audit, indent=2) + "\n")
              print([(v["index"], v["odd_degree8_count"]) for v in audit["trios"]], flush=True)
              if "--audit-only" in sys.argv:
                  return
              results = [run_solver("controle-positivo-phi-zero", T, POSITIVE, "SAT", False),
                         run_solver("controle-negativo-phi-zero", T, NEGATIVE, "UNSAT", False)]
              for i, trio in enumerate(cases, 1):
                  results.append(run_solver(f"trio-{i}", top_from_trio(trio), None, "UNSAT"))
              (OUT / "resumo.json").write_text(json.dumps(results, indent=2) + "\n")
          
          
          if __name__ == "__main__":
              main()
          
          PYTHON
          arquivo=dados/resultados/estrutura/trio_F4F4/trio_s22_seed1.json
          cp trio_mobius.py "$arquivo" trio-mobius-artifacts/
          python -u trio_mobius.py "$arquivo"
      - name: Guardar CNF, DRAT e verificacoes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trio-mobius-i6-i7
          path: trio-mobius-artifacts/
          retention-days: 90
